<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, 'Apple SD Gothic Neo', sans-serif">
  <!-- PPF 부분 시공을 흔히 하는 부위 — p4-supplies 본문(앞범퍼·본넷·도어엣지)을 옆모습에 표시. 새 사실 없음. -->
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- 차 옆모습 (앞이 왼쪽) -->
  <text x="52" y="140" font-size="11" fill="#64748b">◀ 앞쪽</text>
  <rect x="50" y="160" width="540" height="70" rx="22" fill="#dbe4ee" stroke="#7d8fa5" stroke-width="2"/>
  <path d="M150,162 L200,113 Q210,104 225,104 L420,104 Q435,104 445,113 L495,162 Z" fill="#eef3f9" stroke="#7d8fa5" stroke-width="2"/>
  <line x1="255" y1="108" x2="255" y2="228" stroke="#7d8fa5" stroke-width="1.5"/>
  <line x1="380" y1="106" x2="380" y2="228" stroke="#7d8fa5" stroke-width="1.5"/>
  <circle cx="165" cy="232" r="27" fill="#ffffff" stroke="#5b6b7d" stroke-width="7"/>
  <circle cx="475" cy="232" r="27" fill="#ffffff" stroke="#5b6b7d" stroke-width="7"/>

  <!-- 부위 표시 -->
  <circle cx="62" cy="200" r="6" fill="#d97706"/>
  <line x1="62" y1="206" x2="78" y2="262" stroke="#d97706" stroke-width="1.5"/>
  <text x="52" y="282" font-size="13" fill="#92400e">앞범퍼</text>

  <circle cx="112" cy="158" r="6" fill="#d97706"/>
  <line x1="112" y1="152" x2="118" y2="78" stroke="#d97706" stroke-width="1.5"/>
  <text x="58" y="66" font-size="13" fill="#92400e">본넷(엔진룸 덮개)</text>

  <circle cx="380" cy="170" r="6" fill="#d97706"/>
  <line x1="386" y1="166" x2="420" y2="66" stroke="#d97706" stroke-width="1.5"/>
  <text x="392" y="54" font-size="13" fill="#92400e">도어엣지(문 끝 테두리)</text>
</svg>
